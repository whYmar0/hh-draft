version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unitalent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unitalent_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d unitalent_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional pgAdmin for database GUI inspection
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: unitalent_pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@unitalent.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - '5050:80'
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
    driver: local
